[workspace]
resolver = "3"
members = ["crates/parcels_sim", "crates/parcels_game"]

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
parcels_sim = { path = "crates/parcels_sim" }
serde = { version = "1", features = ["derive"] }
ron = "0.10"
postcard = { version = "1", features = ["alloc"] }
bevy = "=0.19.1"
bevy_egui = "=0.42.0"

# Bevy is slow in debug; optimize dependencies but keep our crates debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
