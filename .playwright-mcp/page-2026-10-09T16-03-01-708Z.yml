      - heading "One shared map. Separate budgets." [level=1] [ref=f1e16]: One shared map.Separate budgets.
      - paragraph [ref=f1e17]: Parcels is a 3D city builder for friends and rivals. Each player owns a parcel of the map and runs its own treasury, but roads, power and water cross every border. Trade with your neighbours, outgrow them, or both.
      - generic [ref=f1e18]:
        - link "Download v0.2.0" [ref=f1e19] [cursor=pointer]:
          - /url: "#download"
        - link "Read the manual" [ref=f1e21] [cursor=pointer]:
          - /url: manual.html
      - paragraph [ref=f1e22]: Free and open source · Windows, macOS, Linux · single-player, hot-seat and LAN multiplayer
