        - generic [ref=e30]:
          - heading "Your parcel, your money" [level=3] [ref=e31]
          - paragraph [ref=e32]: Zone residential, commercial, industrial and office land. Buildings grow by themselves when they have roads, power, water and the services they need.
        - generic [ref=e33]:
          - heading "Neighbours you can't ignore" [level=3] [ref=e34]
          - paragraph [ref=e35]: Networks cross parcel borders. Sell surplus power and water at your own price, and watch a neighbour's coal plant drag down your land value.
