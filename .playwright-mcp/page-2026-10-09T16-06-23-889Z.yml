    - article [ref=e35]:
      - heading "Parcelspedia" [level=1] [ref=e36]
      - paragraph [ref=e37]:
        - text: Every item in the game and how the money actually moves. All numbers come from the game's
        - code [ref=e38]: config/balance.ron
        - text: (version 0.2.0), exported by
        - code [ref=e39]: cargo run -p parcels_sim --example pedia
        - text: ", so they match what you play."
      - paragraph [ref=e40]: Money is shown in dollars. The sim counts in cents per tick; a month is 30 ticks.
      - searchbox "Search the Parcelspedia" [ref=e42]
      - generic [ref=e43]:
        - heading "A game tick" [level=2] [ref=e44]
        - paragraph [ref=e45]: "Every tick runs six stages in order, identically on every machine:"
        - list [ref=e46]:
          - listitem [ref=e47]: "Commands: everything players and the AI asked for is applied, sorted by author and sequence."
          - listitem [ref=e48]: "Utilities: power and water networks are flood-filled across parcel borders. Each owner uses their own supply first, then buys from the cheapest neighbour selling. Power is settled before water, because pumps need power."
          - listitem [ref=e49]: "Demand: map-wide residential, commercial, industrial and office demand, shifted per player by their tax rate."
          - listitem [ref=e50]: "Growth: every eligible zone tile on the map competes for one shared pool of newcomers."
          - listitem [ref=e51]: "Land value: service coverage, traffic, pollution and crime are recomputed and land value moves toward its target."
          - listitem [ref=e52]: "Economy: taxes in, upkeep out, trades paid, treasury clamped at the debt floor, scores updated."
        - paragraph [ref=e53]: The game lasts 10 years (3,600 ticks) by default.
      - generic [ref=e54]:
        - heading "Taxes" [level=2] [ref=e55]
        - paragraph [ref=e56]: "Every powered, occupied zone tile you own pays tax every tick:"
        - generic [ref=e57]: tax per tick (¢) = occupants × land value × tax rate % ÷ 1,500tax per month = tax per tick × 30
        - list [ref=e58]:
          - listitem [ref=e59]:
            - text: Occupants = level × people (or jobs) per level of that zone. See
            - link "Zones" [ref=e60] [cursor=pointer]:
              - /url: "#zones"
            - text: .
          - listitem [ref=e61]: "Industry is taxed at base land value (200) wherever it stands: factories don't care about the view. Every other zone pays on its tile's actual land value."
          - listitem [ref=e62]: Unpowered tiles pay nothing.
          - listitem [ref=e63]:
            - text: Tax rate runs from 0 to 20%, default 7%. Each point above 7% cuts your demand (see
            - link "Demand" [ref=e64] [cursor=pointer]:
              - /url: "#demand"
            - text: ), each point below raises it.
        - paragraph [ref=e65]:
          - text: "A useful rule of thumb at 7%:"
          - generic [ref=e66]: each occupant pays $0.14 a month per 100 points of land value.
      - generic [ref=e67]:
        - heading "Revenue calculator" [level=2] [ref=e68]
        - generic [ref=e69]:
