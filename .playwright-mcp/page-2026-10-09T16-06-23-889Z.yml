      - generic [ref=e173]:
        - heading "Land value" [level=2] [ref=e174]
        - paragraph [ref=e175]: "Every tile has a land value from 0 to 1,000. Each tick it moves 1/6 of the way toward a target:"
        - table [ref=e177]:
