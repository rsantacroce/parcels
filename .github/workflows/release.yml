name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            ext: ""
          - os: windows-latest
            name: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            name: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release --bin parcels --bin parcels-server
      - name: Package
        shell: bash
        run: |
          dir=parcels-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir -p "$dir"
          cp target/release/parcels${{ matrix.ext }} target/release/parcels-server${{ matrix.ext }} "$dir/"
          cp -r config README.md "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: parcels-*.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: parcels-*
          generate_release_notes: true
