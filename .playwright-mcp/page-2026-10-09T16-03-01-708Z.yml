      - generic [ref=f1e29]:
        - generic [ref=f1e30]:
          - heading "Your parcel, your money" [level=3] [ref=f1e31]
          - paragraph [ref=f1e32]: Zone residential, commercial, industrial and office land. Buildings grow by themselves when they have roads, power, water and the services they need.
        - generic [ref=f1e33]:
          - heading "Neighbours you can't ignore" [level=3] [ref=f1e34]
          - paragraph [ref=f1e35]: Networks cross parcel borders. Sell surplus power and water at your own price, and watch a neighbour's coal plant drag down your land value.
        - generic [ref=f1e36]:
          - heading "A city that comes alive" [level=3] [ref=f1e37]
          - paragraph [ref=f1e38]:
            - text: Day and night, lit windows, cars, buses and people on the streets. Press
            - generic [ref=f1e39]: V
            - text: and walk your city at street level.
        - generic [ref=f1e40]:
          - heading "Play together" [level=3] [ref=f1e41]
          - paragraph [ref=f1e42]: Solo against AI neighbours, hot-seat on one screen, or host a game on your network. A deterministic simulation keeps everyone in sync.
