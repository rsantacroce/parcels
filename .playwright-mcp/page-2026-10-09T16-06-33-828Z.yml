    - article [ref=f1e71]:
      - heading "Parcelspedia" [level=1] [ref=f1e72]
      - paragraph [ref=f1e73]:
        - text: Every item in the game and how the money actually moves. All numbers come from the game's
        - code [ref=f1e74]: config/balance.ron
        - text: (version 0.2.0), exported by
        - code [ref=f1e75]: cargo run -p parcels_sim --example pedia
        - text: ", so they match what you play."
      - paragraph [ref=f1e76]: Money is shown in dollars. The sim counts in cents per tick; a month is 30 ticks.
      - searchbox "Search the Parcelspedia" [ref=f1e78]
      - generic [ref=f1e79]:
        - heading "A game tick" [level=2] [ref=f1e80]
        - paragraph [ref=f1e81]: "Every tick runs six stages in order, identically on every machine:"
        - list [ref=f1e82]:
          - listitem [ref=f1e83]: "Commands: everything players and the AI asked for is applied, sorted by author and sequence."
          - listitem [ref=f1e84]: "Utilities: power and water networks are flood-filled across parcel borders. Each owner uses their own supply first, then buys from the cheapest neighbour selling. Power is settled before water, because pumps need power."
          - listitem [ref=f1e85]: "Demand: map-wide residential, commercial, industrial and office demand, shifted per player by their tax rate."
          - listitem [ref=f1e86]: "Growth: every eligible zone tile on the map competes for one shared pool of newcomers."
          - listitem [ref=f1e87]: "Land value: service coverage, traffic, pollution and crime are recomputed and land value moves toward its target."
          - listitem [ref=f1e88]: "Economy: taxes in, upkeep out, trades paid, treasury clamped at the debt floor, scores updated."
        - paragraph [ref=f1e89]: The game lasts 10 years (3,600 ticks) by default.
      - generic [ref=f1e90]:
        - heading "Taxes" [level=2] [ref=f1e91]
        - paragraph [ref=f1e92]: "Every powered, occupied zone tile you own pays tax every tick:"
        - generic [ref=f1e93]: tax per tick (¢) = occupants × land value × tax rate % ÷ 1,500tax per month = tax per tick × 30
        - list [ref=f1e94]:
          - listitem [ref=f1e95]:
            - text: Occupants = level × people (or jobs) per level of that zone. See
            - link "Zones" [ref=f1e96] [cursor=pointer]:
              - /url: "#zones"
            - text: .
          - listitem [ref=f1e97]: "Industry is taxed at base land value (200) wherever it stands: factories don't care about the view. Every other zone pays on its tile's actual land value."
          - listitem [ref=f1e98]: Unpowered tiles pay nothing.
          - listitem [ref=f1e99]:
            - text: Tax rate runs from 0 to 20%, default 7%. Each point above 7% cuts your demand (see
            - link "Demand" [ref=f1e100] [cursor=pointer]:
              - /url: "#demand"
            - text: ), each point below raises it.
        - paragraph [ref=f1e101]:
          - text: "A useful rule of thumb at 7%:"
          - generic [ref=f1e102]: each occupant pays $0.14 a month per 100 points of land value.
      - generic [ref=f1e103]:
