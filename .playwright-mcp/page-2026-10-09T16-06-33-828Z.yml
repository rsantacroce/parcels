        - paragraph [ref=f1e147]: Bridges (roads on water) cost double upkeep. Each placed building's upkeep is listed on its entry below.
      - generic [ref=f1e148]:
        - heading "Power and water trade" [level=2] [ref=f1e149]
        - paragraph [ref=f1e150]: "Networks ignore parcel borders. Within one connected network, every owner first covers their own demand from their own plants, pumps and towers. Owners who are still short buy from neighbours who have ticked Sell surplus, cheapest price first. The buyer pays the seller every tick:"
        - generic [ref=f1e151]: trade per tick (¢) = units bought × seller's price (¢ per unit per tick)
        - list [ref=f1e152]:
          - listitem [ref=f1e153]: The AI offers at 4¢ per unit per tick. At that price, one unit sold all month earns $1.20.
          - listitem [ref=f1e154]: "Power use: a zone tile needs 1 + its level; a building needs its listed power draw."
          - listitem [ref=f1e155]: "Water use: a zone tile needs its level (empty lots need none). Levels above 1 won't grow without water."
          - listitem [ref=f1e156]: Water producers make nothing without power. Pumps and treatment plants that touch the river get their river bonus.
      - generic [ref=f1e157]:
        - heading "Score and winning" [level=2] [ref=f1e158]
        - generic [ref=f1e159]: score = treasury + (sum of land value of every tile on your parcel) × 20¢
        - paragraph [ref=f1e160]:
          - text: So each point of land value anywhere on your parcel is worth
          - generic [ref=f1e161]: $0.20
          - text: of score, as much as cash. A 32×24 parcel at an average land value of 400 is worth
          - generic [ref=f1e162]: $61,440
          - text: . The highest score when time runs out wins.
        - paragraph [ref=f1e163]:
          - text: Your treasury starts at
          - generic [ref=f1e164]: $20,000
          - text: . Spending needs cash in hand. Upkeep can push you below zero, but never below
          - generic [ref=f1e165]: −$5,000
          - text: .
      - generic [ref=f1e166]:
        - heading "Demand" [level=2] [ref=f1e167]
        - paragraph [ref=f1e168]: "Workers, jobs and shoppers move freely across the map, so raw demand is computed for the whole map and then normalised to −1000…1000:"
        - generic [ref=f1e169]: region = 100% + 30% per game year R = 80×region + bonuses + (all jobs incl. public) × 130/100 − residents C = 20×region + bonuses + residents × 100/300 − commercial jobs I = 80×region + bonuses + residents × 100/220 − industrial jobs O = 10×region + bonuses + residents × 100/450 − office jobs bar = raw × 1000 ÷ (current size + 100 for R, + 50 for C/I/O)
        - paragraph [ref=f1e170]:
          - text: Your own bars are the map-wide bars minus
          - generic [ref=f1e171]: (your tax − 7) × 4 × 10
          - text: . At 10% tax you lose 120 points on every bar; at 4% you gain 120. Bonuses come from powered landmarks (stadium, town hall, airport); see their entries.
        - paragraph [ref=f1e172]: If your demand for a zone falls below −500, occupied tiles of that zone start leaving even when they are well served.
      - generic [ref=f1e173]:
        - heading "Growth" [level=2] [ref=f1e174]
        - paragraph [ref=f1e175]: "Each tick, up to 4 tiles per zone type, across the whole map, move up or down a level. Which ones is decided by competition:"
        - generic [ref=f1e176]: growth score = land value + your demand ÷ 4 + random 0…60
        - list [ref=f1e177]:
          - listitem [ref=f1e178]: Only tiles that are sustained (powered, a road within 2 tiles, and watered if above level 1) and whose owner has positive demand can grow. The highest scores win, so cheap land loses newcomers to valuable land, including your neighbour's.
          - listitem [ref=f1e179]: When map demand is negative, the lowest-scoring occupied tiles shrink first.
          - listitem [ref=f1e180]: A tile that isn't sustained loses a level with a 4% chance each tick.
        - heading "What each level needs" [level=3] [ref=f1e181]
