      - heading "One shared map. Separate budgets." [level=1] [ref=e16]: One shared map.Separate budgets.
      - paragraph [ref=e17]: Parcels is a 3D city builder for friends and rivals. Each player owns a parcel of the map and runs its own treasury, but roads, power and water cross every border. Trade with your neighbours, outgrow them, or both.
