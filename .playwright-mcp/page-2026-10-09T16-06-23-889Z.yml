      - generic [ref=e84]:
        - heading "Upkeep" [level=2] [ref=e85]
        - paragraph [ref=e86]: Paid every tick for everything you have built on your parcel. Zones themselves cost nothing to keep.
        - table [ref=e88]:
          - rowgroup [ref=e89]:
            - row [ref=e90]:
              - columnheader "Item" [ref=e91]
              - columnheader "Per tick" [ref=e92]
              - columnheader "Per month" [ref=e93]
        - paragraph [ref=e94]: Bridges (roads on water) cost double upkeep. Each placed building's upkeep is listed on its entry below.
      - generic [ref=e95]:
        - heading "Power and water trade" [level=2] [ref=e96]
        - paragraph [ref=e97]: "Networks ignore parcel borders. Within one connected network, every owner first covers their own demand from their own plants, pumps and towers. Owners who are still short buy from neighbours who have ticked Sell surplus, cheapest price first. The buyer pays the seller every tick:"
        - generic [ref=e98]: trade per tick (¢) = units bought × seller's price (¢ per unit per tick)
        - list [ref=e99]:
          - listitem [ref=e100]: The AI offers at 4¢ per unit per tick. At that price, one unit sold all month earns $1.20.
          - listitem [ref=e101]: "Power use: a zone tile needs 1 + its level; a building needs its listed power draw."
          - listitem [ref=e102]: "Water use: a zone tile needs its level (empty lots need none). Levels above 1 won't grow without water."
          - listitem [ref=e103]: Water producers make nothing without power. Pumps and treatment plants that touch the river get their river bonus.
      - generic [ref=e104]:
        - heading "Score and winning" [level=2] [ref=e105]
        - generic [ref=e106]: score = treasury + (sum of land value of every tile on your parcel) × 20¢
        - paragraph [ref=e107]:
          - text: So each point of land value anywhere on your parcel is worth
          - generic [ref=e108]: $0.20
          - text: of score, as much as cash. A 32×24 parcel at an average land value of 400 is worth
          - generic [ref=e109]: $61,440
          - text: . The highest score when time runs out wins.
        - paragraph [ref=e110]:
          - text: Your treasury starts at
          - generic [ref=e111]: $20,000
          - text: . Spending needs cash in hand. Upkeep can push you below zero, but never below
          - generic [ref=e112]: −$5,000
          - text: .
      - generic [ref=e113]:
        - heading "Demand" [level=2] [ref=e114]
        - paragraph [ref=e115]: "Workers, jobs and shoppers move freely across the map, so raw demand is computed for the whole map and then normalised to −1000…1000:"
        - generic [ref=e116]: region = 100% + 30% per game year R = 80×region + bonuses + (all jobs incl. public) × 130/100 − residents C = 20×region + bonuses + residents × 100/300 − commercial jobs I = 80×region + bonuses + residents × 100/220 − industrial jobs O = 10×region + bonuses + residents × 100/450 − office jobs bar = raw × 1000 ÷ (current size + 100 for R, + 50 for C/I/O)
        - paragraph [ref=e117]:
          - text: Your own bars are the map-wide bars minus
          - generic [ref=e118]: (your tax − 7) × 4 × 10
          - text: . At 10% tax you lose 120 points on every bar; at 4% you gain 120. Bonuses come from powered landmarks (stadium, town hall, airport); see their entries.
        - paragraph [ref=e119]: If your demand for a zone falls below −500, occupied tiles of that zone start leaving even when they are well served.
      - generic [ref=e120]:
        - heading "Growth" [level=2] [ref=e121]
        - paragraph [ref=e122]: "Each tick, up to 4 tiles per zone type, across the whole map, move up or down a level. Which ones is decided by competition:"
        - generic [ref=e123]: growth score = land value + your demand ÷ 4 + random 0…60
        - list [ref=e124]:
          - listitem [ref=e125]: Only tiles that are sustained (powered, a road within 2 tiles, and watered if above level 1) and whose owner has positive demand can grow. The highest scores win, so cheap land loses newcomers to valuable land, including your neighbour's.
          - listitem [ref=e126]: When map demand is negative, the lowest-scoring occupied tiles shrink first.
          - listitem [ref=e127]: A tile that isn't sustained loses a level with a 4% chance each tick.
        - heading "What each level needs" [level=3] [ref=e128]
